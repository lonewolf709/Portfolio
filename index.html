/* intro card: round profile at the left corner */
.ic{text-align:left}
.ic .pr{flex-direction:row;justify-content:flex-start;align-items:center;gap:18px;margin:0 0 12px}
.ic .pw{position:relative;flex-shrink:0}
.ic .pa{width:84px;height:84px;border-radius:50%;font-size:28px;animation:none;box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--g1)}
.ic h1{font-size:clamp(24px,7vw,34px)}
.ic h1::after{margin:8px 0 0}
.ic #rl{margin-top:0;display:block}
.ic p.lead{margin:6px 0 0;max-width:none}
.ic .cta{justify-content:flex-start}
.ic .al{margin:12px 0 0;max-width:none}
.ic>.chd{position:absolute;top:10px;right:10px;min-height:0;z-index:2}
.ic .cam{position:absolute;right:-4px;bottom:-4px;padding:6px;border-radius:50%;background:var(--card)}
/* animated profile */
.ic .pa{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--g1);transition:transform .4s cubic-bezier(.2,.9,.3,1.3)}
.ic .pw{animation:popin .5s ease-out backwards,bob 7s ease-in-out .5s infinite}
.ic .cam{z-index:3}
@media(hover:hover){.ic .pw:hover .pa{transform:scale(1.05)}}
.ic .pw:active .pa{transform:scale(.94)}
@keyframes popin{from{opacity:0;transform:scale(.7)}}
@keyframes bob{50%{transform:translateY(-5px)}}
[hidden]{display:none!important}
.pa{position:relative}.pa img{position:absolute;inset:0}
